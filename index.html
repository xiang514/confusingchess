<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confusing Chess</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <p class="brand-mark">Confusingchess.fun</p>
        <div class="title-line">
          <h1>魔改象棋</h1>
          <p class="tagline">线上双人对弈</p>
        </div>
      </header>

      <section class="connect-panel" aria-label="连接房间">
        <form id="connectForm" class="connect-form">
          <label>
            <span>登录名</span>
            <input id="usernameInput" name="username" type="text" autocomplete="username" maxlength="16" placeholder="例如 xiangqi" />
          </label>
          <label>
            <span>登录密码</span>
            <input id="passwordInput" name="password" type="password" autocomplete="current-password" />
          </label>
          <label>
            <span>房间</span>
            <input id="roomInput" name="room" type="text" autocomplete="off" maxlength="32" placeholder="home" />
          </label>
          <div class="connection-state">
            <span id="connectionBadge" class="connection-badge offline">未登录</span>
            <span id="seatInfo">请先注册或登录</span>
          </div>
          <button id="signupBtn" class="tool-button" type="button" title="注册账号" aria-label="注册账号">
            <span aria-hidden="true">＋</span>
            <span>注册</span>
          </button>
          <button id="connectBtn" class="tool-button primary" type="submit" title="登录账号" aria-label="登录账号">
            <span aria-hidden="true">⛓</span>
            <span>登录</span>
          </button>
          <button id="enterRoomBtn" class="tool-button primary" type="button" title="进入房间" aria-label="进入房间">进入</button>
          <button id="disconnectBtn" class="tool-button" type="button" title="退出房间" aria-label="退出房间" disabled>退出</button>
        </form>
      </section>

      <section class="game-layout" aria-label="中国象棋棋局">
        <div class="board-area">
          <div id="board" class="board" role="application" aria-label="中国象棋棋盘">
            <canvas id="boardCanvas" aria-hidden="true"></canvas>
            <div id="boardGrid" class="board-grid"></div>
          </div>
        </div>

        <aside class="side-panel" aria-label="对局信息">
          <div class="players" aria-label="双方状态">
            <div id="redPlayer" class="player red-player">
              <span class="side-dot red-dot" aria-hidden="true"></span>
              <span>
                <strong id="redName">玩家1</strong>
                <small id="redMeta">红方</small>
              </span>
            </div>
            <div id="blackPlayer" class="player black-player">
              <span class="side-dot black-dot" aria-hidden="true"></span>
              <span>
                <strong id="blackName">玩家2</strong>
                <small id="blackMeta">黑方</small>
              </span>
            </div>
          </div>

          <div class="actions board-actions" aria-label="对局操作">
            <button id="dongfengBtn" class="tool-button special" type="button" title="东风炮" aria-label="东风炮">
              <span aria-hidden="true">炮</span>
              <span>东风炮</span>
            </button>
            <button id="mountBtn" class="tool-button special" type="button" title="翻身上马" aria-label="翻身上马">
              <span aria-hidden="true">马</span>
              <span>翻身上马</span>
            </button>
            <button id="undoBtn" class="tool-button" type="button" title="悔棋" aria-label="悔棋">
              <span aria-hidden="true">↶</span>
              <span class="button-text">悔棋</span>
            </button>
            <button id="resetBtn" class="tool-button primary" type="button" title="重新开始" aria-label="重新开始">
              <span aria-hidden="true">↻</span>
              <span>重新开始</span>
            </button>
          </div>

          <section class="status-panel">
            <p class="panel-label">当前回合</p>
            <h2 id="turnTitle">玩家1 · 红方</h2>
            <p id="gameStatus" class="game-status">红方先行</p>
          </section>

          <section class="capture-panel">
            <div>
              <p class="panel-label">玩家1吃子</p>
              <div id="redCaptured" class="captured-line" aria-live="polite"></div>
            </div>
            <div>
              <p class="panel-label">玩家2吃子</p>
              <div id="blackCaptured" class="captured-line" aria-live="polite"></div>
            </div>
          </section>

          <section class="log-panel">
            <div class="panel-heading">
              <p class="panel-label">棋谱</p>
              <span id="moveCount" class="move-count">0 手</span>
            </div>
            <ol id="moveLog" class="move-log" aria-live="polite"></ol>
          </section>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="xiangqi-core.js"></script>
    <script src="script.js"></script>
  </body>
</html>
